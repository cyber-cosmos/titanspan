repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: yaml-style
        name: YAML style and two-space indentation
        entry: uv run --locked yamllint --strict
        language: system
        types: [yaml]
      - id: python-source-standards
        name: Python source standards
        entry: uv run --locked python scripts/check_python_standards.py
        language: system
        pass_filenames: false
      - id: agent-configs
        name: Agent configuration consistency
        entry: uv run --locked python scripts/check_agent_configs.py
        language: system
        pass_filenames: false
      - id: detect-secrets
        name: Detect secrets against the reviewed baseline
        entry: uv run --locked detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^\.secrets\.baseline$
        types: [text]
