name: Set up uv and Python
description: Install the pinned uv release and requested Python version.
inputs:
  python-version:
    description: Supported Python version for the current job.
    required: true
  uv-version:
    description: Pinned uv release.
    required: false
    default: 0.13.9
runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
        python-version: ${{ inputs.python-version }}
        version: ${{ inputs.uv-version }}
