name: Performance and stress

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  benchmarks:
    name: "Benchmark: Implemented framework paths"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked development dependencies
        run: uv sync --locked --all-groups
      - name: Run informational benchmarks
        run: make benchmark
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark-results/results.json
          if-no-files-found: warn
          retention-days: 30

  stress:
    name: "Stress: Lifecycle and resource cleanup"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked development dependencies
        run: uv sync --locked --all-groups
      - name: Run stress suite
        run: make stress-test
      - name: Upload stress test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-test-results
          path: test-results/stress.xml
          if-no-files-found: warn
          retention-days: 14
