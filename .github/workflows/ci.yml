name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: "Quality: Ruff lint"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run strict linting
        run: make lint

  format:
    name: "Quality: Formatting"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Verify formatting without changes
        run: make format-check

  docblocks:
    name: "Quality: Docblocks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate multiline docstrings
        run: make docs-check

  comments:
    name: "Quality: Implementation comments"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate rationale comments
        run: make comments-check

  technical-documentation:
    name: "Quality: Technical documentation"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Install pinned Vale release
        run: make vale-install
      - name: Sync pinned Vale styles and grammar
        run: make vale-sync
      - name: Validate prose, terminology, and Vale rules
        run: |
          make prose-check
          make terminology-check
          make prose-test

  line-length:
    name: "Quality: 80-column limit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Enforce strict source line length
        run: make line-length-check

  syntax:
    name: "Quality: Python syntax"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Parse maintained Python files
        run: make syntax-check

  typecheck:
    name: "Quality: Strict Pyright"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run strict static type checking
        run: make typecheck

  architecture:
    name: "Architecture: Module boundaries"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Enforce dependency direction
        run: make architecture-check

  cross-component:
    name: "Architecture: Cross-component integration"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - lint
      - format
      - docblocks
      - comments
      - technical-documentation
      - line-length
      - syntax
      - typecheck
      - architecture
      - public-api
      - agent-configurations
      - lockfile
      - workflows
    env:
      COVERAGE: collect
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Verify contracts through application lifecycle
        run: make architecture-integration-test
      - name: Summarize test results
        if: always()
        run: >-
          uv run --locked python -m scripts.ci.summarize_junit
          test-results/architecture-integration.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-cross-component
          path: test-results/architecture-integration.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cross-component
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  public-api:
    name: "Quality: Native public API conventions"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE: collect
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Verify native public API conventions and contracts
        run: make public-api-check
      - name: Summarize test results
        if: always()
        run: uv run --locked python -m scripts.ci.summarize_junit test-results/public-api.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-public-api
          path: test-results/public-api.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-public-api
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  agent-configurations:
    name: "Governance: Agent configurations"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate project agent configuration
        run: make agents-check

  lockfile:
    name: "Governance: Locked dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Verify project and lockfile consistency
        run: make lock-check

  workflows:
    name: "Governance: GitHub Actions policy"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate workflow graph and immutable pins
        run: make workflows-check

  unit-tests:
    name: "Tests: Unit (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - lint
      - format
      - docblocks
      - comments
      - technical-documentation
      - line-length
      - syntax
      - typecheck
      - architecture
      - public-api
      - agent-configurations
      - lockfile
      - workflows
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      COVERAGE: ${{ matrix.python-version == '3.12' && 'collect' || 'none' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run isolated unit tests
        id: tests
        run: make unit-test
      - name: Summarize test results
        if: always()
        run: uv run --locked python -m scripts.ci.summarize_junit test-results/unit.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-unit-${{ matrix.python-version }}
          path: test-results/unit.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload canonical coverage data
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  integration-tests:
    name: "Tests: Integration (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - lint
      - format
      - docblocks
      - comments
      - technical-documentation
      - line-length
      - syntax
      - typecheck
      - architecture
      - public-api
      - agent-configurations
      - lockfile
      - workflows
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      COVERAGE: ${{ matrix.python-version == '3.12' && 'collect' || 'none' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run real dependency integrations
        id: tests
        run: make integration-test
      - name: Summarize test results
        if: always()
        run: uv run --locked python -m scripts.ci.summarize_junit test-results/integration.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-integration-${{ matrix.python-version }}
          path: test-results/integration.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload canonical coverage data
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  feature-tests:
    name: "Tests: Framework features"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - lint
      - format
      - docblocks
      - comments
      - technical-documentation
      - line-length
      - syntax
      - typecheck
      - architecture
      - public-api
      - agent-configurations
      - lockfile
      - workflows
    env:
      COVERAGE: collect
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run user-facing feature tests
        id: tests
        run: make feature-test
      - name: Summarize test results
        if: always()
        run: uv run --locked python -m scripts.ci.summarize_junit test-results/feature.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-feature
          path: test-results/feature.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload canonical coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-feature
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  regression-tests:
    name: "Tests: Regression"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - format
      - docblocks
      - comments
      - technical-documentation
      - line-length
      - syntax
      - typecheck
      - architecture
      - public-api
      - agent-configurations
      - lockfile
      - workflows
    env:
      COVERAGE: collect
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run regression tests
        id: tests
        run: make regression-test
      - name: Summarize test results
        if: always()
        run: uv run --locked python -m scripts.ci.summarize_junit test-results/regression.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-regression
          path: test-results/regression.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload canonical coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-regression
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  concurrency-tests:
    name: "Tests: Concurrency and cancellation"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - lint
      - format
      - docblocks
      - comments
      - technical-documentation
      - line-length
      - syntax
      - typecheck
      - architecture
      - public-api
      - agent-configurations
      - lockfile
      - workflows
    env:
      COVERAGE: collect
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run concurrency tests with deadlines
        id: tests
        run: make concurrency-test
      - name: Summarize test results
        if: always()
        run: uv run --locked python -m scripts.ci.summarize_junit test-results/concurrency.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-concurrency
          path: test-results/concurrency.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload canonical coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-concurrency
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  security-tests:
    name: "Tests: Security behavior"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - format
      - docblocks
      - comments
      - technical-documentation
      - line-length
      - syntax
      - typecheck
      - architecture
      - public-api
      - agent-configurations
      - lockfile
      - workflows
    env:
      COVERAGE: collect
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run security-focused behavior tests
        id: tests
        run: make security-test
      - name: Summarize test results
        if: always()
        run: uv run --locked python -m scripts.ci.summarize_junit test-results/security.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-security
          path: test-results/security.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload canonical coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-security
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  component-api-tests:
    name: "Tests: Support and logging APIs"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - lint
      - format
      - docblocks
      - comments
      - technical-documentation
      - line-length
      - syntax
      - typecheck
      - architecture
      - public-api
      - agent-configurations
      - lockfile
      - workflows
    env:
      COVERAGE: collect
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Run Support and logging behavior tests
        id: tests
        run: make component-api-test
      - name: Summarize test results
        if: always()
        run: uv run --locked python -m scripts.ci.summarize_junit test-results/component-api.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-component-api
          path: test-results/component-api.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload canonical coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-component-api
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  platform-smoke:
    name: "Compatibility: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [lockfile]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run cross-platform API smoke tests
        run: >-
          uv run --locked pytest tests/unit/test_cli.py
          tests/unit/test_application.py tests/unit/support/test_str.py
          tests/unit/logging/test_record.py -m unit -q
      - name: Verify command-line entry point
        run: |
          uv run --locked titanspan --help
          uv run --locked titanspan --version

  dependency-audit:
    name: "Security: Python dependency audit"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lockfile]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install all locked profiles
        run: uv sync --locked --all-groups --all-extras
      - name: Audit installed dependencies
        run: make audit

  secret-scanning:
    name: "Security: Secret scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lockfile]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Scan tracked files without printing secret values
        run: make secrets-check

  license-compliance:
    name: "Security: Runtime license inventory"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lockfile]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install all locked profiles
        run: uv sync --locked --all-groups --all-extras
      - name: Audit runtime dependency licenses
        run: make license-check | tee license-report.txt
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-license-report
          path: license-report.txt
          if-no-files-found: warn
          retention-days: 30

  codeql:
    name: "Security: CodeQL"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lockfile]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: python
          queries: security-and-quality
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4

  build:
    name: "Build: Wheel and source distribution"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lockfile]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Build and validate both distributions
        run: make build
      - name: Upload validated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  installation:
    name: "Runtime: Clean installation"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Download exact build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Install minimal and optional profiles
        shell: bash
        env:
          TEMP_ROOT: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          uv venv --python 3.12 "$TEMP_ROOT/titanspan-minimal"
          uv pip install \
            --python "$TEMP_ROOT/titanspan-minimal/bin/python" \
            "${wheels[0]}"
          uv venv --python 3.12 "$TEMP_ROOT/titanspan-numbers"
          uv pip install \
            --python "$TEMP_ROOT/titanspan-numbers/bin/python" \
            "${wheels[0]}[numbers]"
      - name: Verify installed package outside the source tree
        working-directory: ${{ runner.temp }}
        env:
          MINIMAL_PYTHON: ${{ runner.temp }}/titanspan-minimal/bin/python
          NUMBERS_PYTHON: ${{ runner.temp }}/titanspan-numbers/bin/python
        run: |
          "$MINIMAL_PYTHON" -c '
          from importlib.metadata import version
          from pathlib import Path

          import titanspan

          package = Path(titanspan.__file__).parent
          installed = version("titanspan")
          assert installed and titanspan.__version__ == installed
          assert (package / "py.typed").is_file()
          assert not list(package.rglob("AGENTS.md"))
          print(titanspan.__file__)
          '
          "$NUMBERS_PYTHON" -c '
          import titanspan
          import babel
          import num2words

          print(titanspan.__version__)
          '

  cli-smoke:
    name: "Runtime: Installed CLI"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Download exact build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Install wheel in a clean environment
        shell: bash
        env:
          TEMP_ROOT: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
