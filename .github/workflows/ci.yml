      - integration-tests
      - feature-tests
      - regression-tests
      - concurrency-tests
      - security-tests
      - component-api-tests
      - platform-smoke
      - coverage
      - dependency-audit
      - secret-scanning
      - license-compliance
      - codeql
      - build
      - installation
      - cli-smoke
      - application-smoke
      - docker-smoke
      - docs-build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify mandatory job results
        env:
