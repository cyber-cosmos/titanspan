      - name: Verify installed command help and version
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/titanspan-cli/bin/titanspan" --help
          "$RUNNER_TEMP/titanspan-cli/bin/titanspan" --version

  application-smoke:
    name: "Runtime: Installed application lifecycle"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Download exact build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Install wheel in a clean environment
        shell: bash
        env:
          TEMP_ROOT: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          uv venv --python 3.12 "$TEMP_ROOT/titanspan-app"
          uv pip install \
            --python "$TEMP_ROOT/titanspan-app/bin/python" \
            "${wheels[0]}"
      - name: Run ASGI startup, HTTP, and shutdown smoke
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/titanspan-app/bin/python"
          "$GITHUB_WORKSPACE/scripts/ci/runtime_smoke.py"

  docker-smoke:
    name: "Runtime: Docker and Compose"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lockfile]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose and run non-root image smoke
        run: make docker-check
      - name: Upload Compose diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-compose-diagnostics
          path: test-results/docker-compose.log
          if-no-files-found: ignore
          retention-days: 7

  docs-build:
    name: "Docs: Starlight build"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lockfile]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install locked documentation dependencies
        run: npm ci --ignore-scripts --prefix docs
      - name: Audit documentation dependencies
        run: npm audit --prefix docs --audit-level=moderate
      - name: Build and validate documentation
        run: make docs-build
      - name: Install Playwright browser
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Verify rendered documentation
        run: npm --prefix docs run docs:test:e2e
      - name: Upload built documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starlight-site
          path: docs/dist
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: "Coverage: Lines and branches"
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - unit-tests
      - integration-tests
      - cross-component
      - feature-tests
      - regression-tests
      - concurrency-tests
      - security-tests
      - component-api-tests
      - public-api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python tools
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Download canonical coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
      - name: Validate complete artifact inventory
        run: >-
          uv run --locked python -m scripts.ci.collect_coverage
          coverage-artifacts coverage-combined
      - name: Combine compatible coverage data
        run: >-
          uv run --locked coverage combine
          --data-file coverage-combined/.coverage
          --keep coverage-combined
      - name: Enforce line and branch thresholds independently
        env:
          COVERAGE_FILE: coverage-combined/.coverage
        run: |
          # The policy validator checks line and branch coverage separately.
          uv run --locked coverage report --fail-under=0
          uv run --locked coverage json --fail-under=0 -o coverage.json
          uv run --locked coverage xml --fail-under=0 -o coverage.xml
          uv run --locked python scripts/check_coverage.py coverage.json
      - name: Enforce changed source line coverage
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git check-ref-format --branch "$BASE_REF"
              compare_ref="origin/$BASE_REF"
              ;;
            push)
              if [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]] \
                && [[ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
                compare_ref="$EVENT_BEFORE"
              else
                compare_ref="HEAD^1"
              fi
              ;;
            *)
              compare_ref="HEAD^1"
              ;;
          esac
          uv run --locked diff-cover coverage.xml \
            --compare-branch="$compare_ref" \
            --include "src/titanspan/**" \
            --fail-under=95 \
            --markdown-report=diff-coverage.md
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.xml
            diff-coverage.md
          if-no-files-found: warn
          retention-days: 14

  ci-gate:
    name: "Gate: All mandatory CI checks"
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
