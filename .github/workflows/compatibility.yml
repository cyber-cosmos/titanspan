name: Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "42 5 * * 3"

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  unit-matrix:
    name: "Compatibility: ${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked development dependencies
        run: uv sync --locked --all-groups
      - name: Run the unit suite
        run: >-
          uv run --locked pytest tests/unit -m unit
          --junitxml=unit.xml -q
      - name: Summarize test results
        if: always() && hashFiles('unit.xml') != ''
        run: uv run --locked python -m scripts.ci.summarize_junit unit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: unit.xml
          if-no-files-found: warn
          retention-days: 14
