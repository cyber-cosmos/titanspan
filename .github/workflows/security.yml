name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: 0.13.9
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Scan tracked files for secrets
        run: make secrets-check

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: 0.13.9
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Audit installed dependencies
        run: make audit

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: python
          queries: security-and-quality
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4

  security-required:
    name: security-required
    if: always()
    needs: [secret-scan, dependency-audit, dependency-review, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm security jobs succeeded
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$SECRET_SCAN_RESULT" != "success" ]] \
            || [[ "$DEPENDENCY_AUDIT_RESULT" != "success" ]] \
            || [[ "$CODEQL_RESULT" != "success" ]]; then
            echo "Security jobs failed:"
            echo "secrets=$SECRET_SCAN_RESULT"
            echo "dependencies=$DEPENDENCY_AUDIT_RESULT"
            echo "codeql=$CODEQL_RESULT"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]] \
            && [[ "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
            echo "Dependency review failed: $DEPENDENCY_REVIEW_RESULT"
            exit 1
          fi
          echo "All security jobs succeeded."
