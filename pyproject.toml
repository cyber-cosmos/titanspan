[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[project]
name = "titanspan"
version = "0.1.0.dev0"
description = "An expressive, async-first Python framework for intelligent systems."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Cyber Cosmos" }]
keywords = ["ai", "async", "framework", "python", "workflow-orchestration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "dishka>=1.6,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "rich>=13.9,<15",
    "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/Cyber-Cosmos/titanspan"
Repository = "https://github.com/Cyber-Cosmos/titanspan"
Documentation = "https://github.com/Cyber-Cosmos/titanspan/tree/main/docs"
Issues = "https://github.com/Cyber-Cosmos/titanspan/issues"
Changelog = "https://github.com/Cyber-Cosmos/titanspan/blob/main/CHANGELOG.md"

[project.scripts]
titanspan = "titanspan.console.cli:main"

[dependency-groups]
dev = [
    "detect-secrets>=1.5,<2",
    "httpx2>=2,<3",
    "hypothesis>=6.130,<7",
    "import-linter>=2.17,<3",
    "pip-audit>=2.9,<3",
    "pre-commit>=4.2,<5",
    "pyright>=1.1.400,<2",
    "pytest>=8.3,<10",
    "pytest-benchmark>=5,<6",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<0.15",
    "uvicorn[standard]>=0.34,<1",
    "yamllint>=1.37,<2",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
wheel-exclude = ["**/AGENTS.md"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "src", "examples/hello-world"]
strict_config = true
strict_markers = true
testpaths = ["tests"]
markers = [
    "benchmark: performance measurement without a shared-runner threshold",
    "feature: user-visible behavior across framework boundaries",
    "integration: real framework or dependency boundary behavior",
    "regression: reproduces a previously observed defect",
    "security: validates a security or repository security policy",
    "stress: repeated or high-volume behavior checks",
    "slow: test excluded from the fast default suite",
    "unit: isolated behavior without infrastructure services",
]

[tool.coverage.run]
branch = true
source = ["titanspan"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.titanspan.quality]
minimum-branch-coverage = 90

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"
src = ["src", "tests", "examples", "benchmarks", "scripts"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "F",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "D200", # Multi-line docstrings are required, even when concise.
    "D418", # Project policy requires docs on overload declarations too.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"benchmarks/**" = ["S101"]
"src/titanspan/support/arr.py" = [
    "N815", # Laravel-compatible aliases intentionally retain camelCase.
]
"src/titanspan/support/conditionable.py" = [
    "N815", # Laravel-compatible async aliases retain camelCase.
]
"src/titanspan/support/macroable.py" = [
    "N815", # Laravel-compatible macro aliases retain camelCase.
]
"src/titanspan/support/fluent.py" = [
    "N802", # Laravel-compatible methods intentionally retain camelCase.
    "N815", # Laravel-compatible aliases retain camelCase.
]
"src/titanspan/support/message_bag.py" = [
    "A002", # Keep Laravel's public format argument name.
    "N802", # Laravel-compatible aliases retain camelCase.
]
"src/titanspan/contracts/message_bag.py" = [
    "A002", # Keep Laravel's public format argument name.
    "N802", # Laravel-compatible protocol aliases retain camelCase.
]
"src/titanspan/contracts/deferring_displayable_value.py" = [
    "N802", # Preserve Laravel's public resolveDisplayableValue alias.
    "N815", # Preserve the Laravel-compatible protocol alias.
]
"tests/unit/support/test_html_strings.py" = [
    "N802", # Exercise the original Illuminate protocol method spelling.
    "N815", # Exercise the Laravel-compatible deferred-value protocol alias.
]
"tests/unit/support/test_helpers.py" = [
    "N815", # Exercise Laravel-compatible camelCase callback protocols.
]
"src/titanspan/support/str.py" = [
    "N815", # Laravel-compatible aliases intentionally retain camelCase.
]
"src/titanspan/support/stringable.py" = [
    "A002", # Retain selected Illuminate-compatible argument names.
    "N802", # Laravel-compatible methods intentionally retain camelCase.
    "N815", # Laravel-compatible aliases intentionally retain camelCase.
]
"src/titanspan/support/html_string.py" = [
    "N815", # Laravel-compatible aliases intentionally retain camelCase.
]
"src/titanspan/support/encoded_html_string.py" = [
    "N815", # Laravel-compatible aliases intentionally retain camelCase.
]
"src/titanspan/contracts/htmlable.py" = [
    "N802", # Preserve the Laravel-compatible Protocol method spelling.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 8
max-statements = 50

[tool.ruff.lint.pycodestyle]
max-line-length = 80

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "examples", "benchmarks", "scripts"]
exclude = ["**/__pycache__"]
extraPaths = ["src", "examples/hello-world"]
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_packages = ["titanspan"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Implemented core dependency direction"
type = "layers"
layers = [
    "titanspan.console",
    "titanspan.foundation",
    "titanspan.container",
    "titanspan.config",
]
