[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[project]
name = "titanspan"
version = "0.1.0.dev0"
description = "An expressive, async-first Python framework for intelligent systems."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Jerome Thayananthajothy" }]
keywords = ["ai", "async", "framework", "python", "workflow-orchestration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.16,<5",
    "dishka>=1.6,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "rich>=13.9,<15",
    "structlog>=26.1,<27",
    "tenacity>=9.1,<10",
    "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/titanspan/titanspan"
Repository = "https://github.com/titanspan/titanspan"
Documentation = "https://github.com/titanspan/titanspan/tree/main/docs"
Issues = "https://github.com/titanspan/titanspan/issues"
Changelog = "https://github.com/titanspan/titanspan/blob/main/CHANGELOG.md"

[project.scripts]
titanspan = "titanspan.console.cli:main"

[project.optional-dependencies]
numbers = [
    "babel>=2.18,<3",
    "num2words>=0.5.14,<1",
]

[dependency-groups]
dev = [
    "babel>=2.18,<3",
    "defusedxml>=0.7.1,<1",
    "detect-secrets>=1.5,<2",
    "diff-cover>=9,<12",
    "httpx2>=2,<3",
    "hypothesis>=6.130,<7",
    "import-linter>=2.17,<3",
    "num2words>=0.5.14,<1",
    "packaging>=25,<27",
    "pip-audit>=2.9,<3",
    "pip-licenses>=5,<6",
    "pre-commit>=4.2,<5",
    "pyright>=1.1.400,<2",
    "pytest>=8.3,<10",
    "pytest-benchmark>=5,<6",
    "pytest-cov>=6,<8",
    "pyyaml>=6,<7",
    "ruff>=0.14,<0.18",
    "twine>=7,<8",
    "types-pyyaml>=6.0,<7",
    "uvicorn[standard]>=0.34,<1",
    "yamllint>=1.37,<2",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
source-exclude = ["**/AGENTS.md"]
wheel-exclude = ["**/AGENTS.md"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "src", "examples/hello-world"]
strict_config = true
strict_markers = true
testpaths = ["tests"]
markers = [
    "architecture: verifies real cross-component framework composition",
    "benchmark: performance measurement without a shared-runner threshold",
    "concurrency: cancellation, isolation, bounded execution, or shutdown",
    "feature: user-visible behavior across framework boundaries",
    "integration: real framework or dependency boundary behavior",
    "regression: reproduces a previously observed defect",
    "security: validates a security or repository security policy",
    "stress: repeated or high-volume behavior checks",
    "slow: test excluded from the fast default suite",
    "unit: isolated behavior without infrastructure services",
]

[tool.coverage.run]
branch = true
source = ["titanspan"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.titanspan.quality]
minimum-branch-coverage = 90

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"
src = ["src", "tests", "examples", "benchmarks", "scripts"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "F",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "D200", # Multi-line docstrings are required, even when concise.
    "D418", # Project policy requires docs on overload declarations too.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"benchmarks/**" = ["S101"]
"src/titanspan/support/uri_query_string.py" = [
    "SLF001", # The URI query adapter reads its owning URI's private state.
]
"src/titanspan/support/benchmark.py" = [
    "PIE790", # Keep required overload declarations explicit.
]
"src/titanspan/support/number.py" = [
    "PLC0415", # Load optional number libraries only when called.
]
"src/titanspan/logging/drivers/standard.py" = [
    "N802", # Match TimedRotatingFileHandler.computeRollover.
    "N803", # Match the computeRollover parameter required by the base hook.
]
"tests/integration/logging/test_webhook.py" = [
    "A002", # Match BaseHTTPRequestHandler.log_message's format parameter.
]
"tests/unit/support/test_number.py" = [
    "PLR2004", # Keep expected numeric outputs readable in behavior examples.
]
"tests/integration/support/test_number_integration.py" = [
    "PLR2004", # Keep exact locale conversion fixtures readable.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 8
max-statements = 50

[tool.ruff.lint.pycodestyle]
max-line-length = 80

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
stubPath = "stubs"
include = ["src", "tests", "examples", "benchmarks", "scripts"]
exclude = ["**/__pycache__"]
extraPaths = ["src", "examples/hello-world"]
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_packages = ["titanspan"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Implemented core dependency direction"
type = "layers"
layers = [
    "titanspan.console",
    "titanspan.foundation",
    "titanspan.container",
    "titanspan.config",
    "titanspan.contracts",
]
